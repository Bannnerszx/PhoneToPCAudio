# Builds an UNSIGNED .ipa on a macOS runner. AltStore Classic re-signs it with
# your free Apple ID when you install it, so no Apple Developer account is needed.
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Version tags (v1.0.0, ...) also publish the .ipa as a GitHub release.
    tags: ['v*']
    # PC-only changes don't need a (slow, 10x-billed) macOS build.
    # (Path filters don't apply to tag pushes.)
    paths-ignore:
      - 'pc-sender/**'
      - '.github/workflows/windows-pc-app.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # for attaching the .ipa to a release
    env:
      APP_NAME: PCAudio # must match "name" in app.json (Xcode scheme/workspace name)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "ios/${APP_NAME}.xcworkspace" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${APP_NAME}.app" Payload/
          zip -qry "${APP_NAME}.ipa" Payload
          ls -lh "${APP_NAME}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 14

      # The README links to releases/latest/download/PCAudio.ipa. The Windows
      # workflow runs for the same tag; whichever finishes first creates the release.
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "PCAudio $GITHUB_REF_NAME" --notes-file .github/release-notes.md || true
          gh release upload "$GITHUB_REF_NAME" "${APP_NAME}.ipa" --clobber
