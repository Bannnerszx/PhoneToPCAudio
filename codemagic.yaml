# Builds an UNSIGNED .ipa on Codemagic's macOS machines, the same way as
# .github/workflows/ios-unsigned.yml. AltStore Classic re-signs it with your
# free Apple ID when you install it, so no Apple Developer account is needed.
#
# Start it from the Codemagic dashboard (Start new build -> "iOS unsigned IPA"),
# then download PCAudio.ipa from the build's Artifacts.
workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: PCAudio # must match "name" in app.json (Xcode scheme/workspace name)
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Build (no code signing)
        script: |
          set -o pipefail
          xcodebuild \
            -workspace "ios/${APP_NAME}.xcworkspace" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Package .ipa
        script: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${APP_NAME}.app" Payload/
          zip -qry "${APP_NAME}.ipa" Payload
          ls -lh "${APP_NAME}.ipa"
    artifacts:
      - PCAudio.ipa
